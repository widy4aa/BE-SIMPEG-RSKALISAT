version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - laravel_network
    command: >
      sh -c "
        mkdir -p
          storage/framework/views
          storage/framework/cache
          storage/framework/sessions
          public/dokumen/foto
          public/dokumen/foto-profil
          public/dokumen/ktp
          public/dokumen/kk
          public/dokumen/str
          public/dokumen/sip
          public/dokumen/penugasan-klinis
          public/dokumen/ijazah
          public/dokumen/sertif-diklat
          public/dokumen/jabatan
          public/dokumen/pangkat
          public/dokumen/pasangan
          public/dokumen/anak
        &&
        chown -R www-data:www-data storage bootstrap/cache public/dokumen
        &&
        chmod -R 775 storage bootstrap/cache public/dokumen
        &&
        php artisan view:clear &&
        php artisan cache:clear &&
        php artisan config:clear &&
        php-fpm
      "
    # Note: PHP-FPM requires necessary PHP extensions for Laravel (like pdo_mysql).

  web:
    image: docker.io/library/nginx:alpine
    container_name: laravel_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network
    depends_on:
      - app

  db:
    image: docker.io/library/mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      # If using a user other than root:
      # MYSQL_USER: ${DB_USERNAME}
      # MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_network

  adminer:
    image: docker.io/library/adminer
    container_name: laravel_adminer
    restart: unless-stopped
    ports:
      - "9000:8080"
    networks:
      - laravel_network
    depends_on:
      - db

networks:
  laravel_network:
    driver: bridge

volumes:
  db_data:
