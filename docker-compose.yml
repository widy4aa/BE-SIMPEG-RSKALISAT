version: '3.8'

services:
  # ── PHP-FPM App ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: simpeg_app
    restart: unless-stopped
    tty: true
    stdin_open: true
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    networks:
      - simpeg_network
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx (HTTP → HTTPS redirect + SSL termination) ───────────────────────
  web:
    image: nginx:alpine
    container_name: simpeg_web
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/nginx/ssl
    networks:
      - simpeg_network
    depends_on:
      - app
    command: >
      sh -c "
        if [ ! -f /etc/nginx/ssl/cert.pem ]; then
          apk add --no-cache openssl;
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout /etc/nginx/ssl/key.pem -out /etc/nginx/ssl/cert.pem -subj '/C=ID/ST=JawaBarat/L=Bandung/O=RSKALISAT/OU=SIMPEG/CN=localhost';
        fi;
        nginx -g 'daemon off;'
      "


  # ── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: simpeg_db
    restart: unless-stopped
    command: --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - simpeg_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Adminer (DB GUI) ───────────────────────────────────────────────────────
  adminer:
    image: adminer
    container_name: simpeg_adminer
    restart: unless-stopped
    ports:
      - "9000:8080"
    networks:
      - simpeg_network
    depends_on:
      db:
        condition: service_healthy

networks:
  simpeg_network:
    driver: bridge

volumes:
  db_data:
  vendor_data:
  ssl_certs:   # Named volume untuk menyimpan cert agar persist antar restart
