version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    tty: true          # fix: agar bisa exec bash / shell interaktif
    stdin_open: true   # fix: agar bisa exec bash / shell interaktif
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor  # vendor dari build image, persist di named volume
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    networks:
      - laravel_network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: docker.io/library/nginx:alpine
    container_name: laravel_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network
    depends_on:
      - app

  db:
    image: docker.io/library/mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  adminer:
    image: docker.io/library/adminer
    container_name: laravel_adminer
    restart: unless-stopped
    ports:
      - "9000:8080"
    networks:
      - laravel_network
    depends_on:
      db:
        condition: service_healthy

networks:
  laravel_network:
    driver: bridge

volumes:
  db_data:
  vendor_data:
